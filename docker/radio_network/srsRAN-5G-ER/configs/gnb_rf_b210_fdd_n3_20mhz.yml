# This example configuration outlines how to configure the srsRAN Project gNB to create a single FDD cell
# transmitting in band 3, with 20 MHz bandwidth and 30 kHz sub-carrier-spacing. A USRP N3XX is configured 
# as the RF frontend using split 8. Note in this example the internal GPDSO of the N310 is used.

amf:
  #addr: 127.0.1.100
  addr: 10.53.1.2
  #bind_addr: 127.0.0.1
  bind_addr: 10.53.1.3

ru_sdr:
  device_driver: uhd                  
  device_args: type=b200,num_recv_frames=64,num_send_frames=64              
  #clock: gpsdo                        
  #sync: gpsdo                         
  #srate: 30.72                        
  srate: 23.04
  #tx_gain: 35                         
  tx_gain: 80
  rx_gain: 40 #60                         

cell_cfg:
  #dl_arfcn: 368640                    
  dl_arfcn: 368500
  band: 3                             
  channel_bandwidth_MHz: 20           
  common_scs: 15                      
  plmn: "00101"                       
  tac: 7                              
  pci: 1 
  sched_expert_cfg:
    policy_sched_cfg:
      pf_sched:
        pf_sched_fairness_coeff: 1.5
  csi:
    csi_rs_enabled: true
    csi_rs_period: 20

log:
  filename: /tmp/gnb.log              
  all_level: info                     

pcap:
  mac_enable: false                   
  mac_filename: /tmp/gnb_mac.pcap     
  ngap_enable: false                  
  ngap_filename: /tmp/gnb_ngap.pcap   
